name: ja-media-lakehouse-dev

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:17-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ja_media_lakehouse_test}
      POSTGRES_USER: ${POSTGRES_USER:-ja_media_lakehouse_test}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ja_media_lakehouse_test}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 2s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ja_media_lakehouse_test}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ja-media-lakehouse-test-only}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-59000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-59001}:9001"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  minio-init:
    image: ${MINIO_CLIENT_IMAGE:-quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z}
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-ja_media_lakehouse_test}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-ja-media-lakehouse-test-only}
      MINIO_BUCKET: ${MINIO_BUCKET:-ja-media-lakehouse-test}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"; do
          sleep 1
        done
        mc mb --ignore-existing "local/$${MINIO_BUCKET}"
        mc anonymous set none "local/$${MINIO_BUCKET}"
    restart: "no"

volumes:
  postgres-data:
  minio-data:
