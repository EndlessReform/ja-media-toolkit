x-dagster-environment: &dagster-environment
  DAGSTER_HOME: /opt/dagster/home
  DAGSTER_PG_HOST: ${DAGSTER_PG_HOST:?set DAGSTER_PG_HOST in .env}
  DAGSTER_PG_PORT: ${DAGSTER_PG_PORT:-5432}
  DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
  DAGSTER_PG_USERNAME: ${DAGSTER_PG_USERNAME:-dagster}
  DAGSTER_PG_PASSWORD: ${DAGSTER_PG_PASSWORD:?set DAGSTER_PG_PASSWORD in .env}
  DAGSTER_MAX_CONCURRENT_RUNS: ${DAGSTER_MAX_CONCURRENT_RUNS:-2}

x-dagster-service: &dagster-service
  image: ${DAGSTER_IMAGE:-ja-media/dagster:1.13.12}
  build:
    context: .
    args:
      DAGSTER_VERSION: ${DAGSTER_VERSION:-1.13.12}
      DAGSTER_LIBRARY_VERSION: ${DAGSTER_LIBRARY_VERSION:-0.29.12}
  restart: unless-stopped
  environment: *dagster-environment
  volumes:
    - type: bind
      source: ${DAGSTER_DATA_PATH:-./data}
      target: /var/lib/dagster

services:
  code-location:
    <<: *dagster-service
    command:
      - dagster
      - api
      - grpc
      - --host
      - 0.0.0.0
      - --port
      - "4000"
      - --python-file
      - /opt/dagster/app/definitions.py
    healthcheck:
      test: ["CMD", "dagster", "api", "grpc-health-check", "--host", "127.0.0.1", "--port", "4000"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 20s

  daemon:
    <<: *dagster-service
    command: ["dagster-daemon", "run", "--workspace", "/opt/dagster/home/workspace.yaml"]
    depends_on:
      code-location:
        condition: service_healthy

  webserver:
    <<: *dagster-service
    command:
      - dagster-webserver
      - --host
      - 0.0.0.0
      - --port
      - "3000"
      - --workspace
      - /opt/dagster/home/workspace.yaml
    ports:
      - "${DAGSTER_WEB_BIND_ADDR:-0.0.0.0}:${DAGSTER_WEB_PORT:-3000}:3000"
    depends_on:
      code-location:
        condition: service_healthy
      daemon:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:3000/server_info"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
