name: qwen3-forced-aligner-vllm

services:
  vllm:
    image: ${VLLM_AUDIO_IMAGE:-qwen3-forced-aligner-vllm:0.24.0-audio}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VLLM_BASE_IMAGE: ${VLLM_BASE_IMAGE:-vllm/vllm-openai:v0.24.0}
        VLLM_AUDIO_EXTRA_VERSION: ${VLLM_AUDIO_EXTRA_VERSION:-0.24.0}
    restart: unless-stopped
    environment:
      HF_HOME: /root/.cache/huggingface
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
      MODEL_ID: ${MODEL_ID:-Qwen/Qwen3-ForcedAligner-0.6B}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.90}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-}
      EXTRA_VLLM_ARGS: ${EXTRA_VLLM_ARGS:-}
    volumes:
      - ${HF_HOME:-/var/lib/qwen3-forced-aligner/huggingface}:/root/.cache/huggingface
      - ./config:/config:ro
    ipc: host
    entrypoint: ["/usr/local/bin/serve-vllm"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          python3 -c "import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5).read()"
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

  adapter:
    image: ${ALIGNER_ADAPTER_IMAGE:-qwen3-forced-aligner-adapter:local}
    build:
      context: ../..
      dockerfile: deploy/qwen3-forced-aligner-vllm/adapter.Dockerfile
    restart: unless-stopped
    depends_on:
      vllm:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8000}:8000"
    environment:
      HF_HOME: /root/.cache/huggingface
      ALIGNER_VLLM_BASE_URL: http://vllm:8000
      ALIGNER_AUDIO_CACHE_DIR: /var/cache/ja-media/audio
      ALIGNER_BRONZE_ENDPOINT_URL: ${ALIGNER_BRONZE_ENDPOINT_URL:?set in .env}
      ALIGNER_BRONZE_BUCKET: ${ALIGNER_BRONZE_BUCKET:?set in .env}
      ALIGNER_BRONZE_PREFIX: ${ALIGNER_BRONZE_PREFIX:-audio/anime/bronze-v2}
      ALIGNER_BRONZE_ADDRESSING_STYLE: ${ALIGNER_BRONZE_ADDRESSING_STYLE:-path}
      ALIGNER_BRONZE_ACCESS_KEY_ID: ${ALIGNER_BRONZE_ACCESS_KEY_ID:-}
      ALIGNER_BRONZE_SECRET_ACCESS_KEY: ${ALIGNER_BRONZE_SECRET_ACCESS_KEY:-}
    volumes:
      - ${HF_HOME:-/var/lib/qwen3-forced-aligner/huggingface}:/root/.cache/huggingface
      - ${ALIGNER_AUDIO_CACHE:-/var/lib/qwen3-forced-aligner/audio}:/var/cache/ja-media/audio
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8000/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
