[project]
name = "forced-alignment-retiming"
version = "0.1.0"
description = "Bounded experiments for retiming cleaned Japanese subtitles"
requires-python = ">=3.13"
dependencies = [
    "ja-media-core",
    "ja-media-data",
]

[project.scripts]
retiming-research = "forced_alignment_retiming.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=9.1.0"]

[tool.uv.sources]
ja-media-core = { workspace = true }
ja-media-data = { workspace = true }
