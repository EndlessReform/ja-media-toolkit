[project]
name = "srt-cleaning-survey"
version = "0.1.0"
description = "Bounded LLM survey and review TUI for discovering deterministic SRT cleaning rules"
requires-python = ">=3.13"
dependencies = [
    "ja-media-frontend",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "tenacity>=9.1.4",
]

[project.scripts]
ja-media-srt-clean = "srt_cleaning_survey.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/srt_cleaning_survey"]

[tool.uv.sources]
ja-media-frontend = { path = "../../packages/frontend", editable = true }
ja-media-core = { path = "../../packages/core", editable = true }
ja-media-media = { path = "../../packages/media", editable = true }
