[project]
name = "ja-media-core"
version = "0.1.0"
description = "Shared types, config, manifests, job/result contracts"
requires-python = ">=3.13"
dependencies = [
    "fasttext-langdetect>=1.0.5",
    "httpx>=0.28,<1",
    "parse-torrent-title>=2.8.2",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pysrt>=1.1.2",
]

[project.optional-dependencies]
audio = [
    "numpy>=2.4.4",
    "soundfile>=0.13.1",
]

[dependency-groups]
dev = [
    "numpy>=2.4.4",
    "pytest>=9.1.0",
    "soundfile>=0.13.1",
]
