# Developer access to the persistent shared DEV data lake.
# Copy to the ignored config.dev.toml and replace the example endpoints.
environment = "dev"

[bronze]
endpoint_url = "http://storage.example.ts.net:3900"
bucket = "ja-media-bronze-v2"
prefix = "audio/anime/bronze"
addressing_style = "path"

[ducklake]
# PostgreSQL and S3 credentials belong in the adjacent ignored .env.dev.
catalog_schema = "ja_media_ducklake_dev"
data_path = "s3://ja-media-dev/ducklake/dev/"
s3_endpoint_url = "http://storage.example.ts.net:3900"
s3_region = "garage"

[control]
schema = "ja_media_control"

[dagster]
ui_url = "http://data-dev.example.ts.net:8080/dagster"

[services]
root_url = "http://services.example.ts.net"

[agent]
# Optional server defaults; the browser can provide both per run.
# model_id = "gpt-5.6-terra"
# base_url = "https://api.openai.com/v1"
max_turns = 12
openai_tracing_enabled = false
