[project]
name = "ja-media-data"
version = "0.1.0"
description = "DuckLake data compiler and operator surface for ja-media"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.46",
    "dagster>=1.13.14",
    "dagster-celery>=0.29.14,<0.30",
    "dagster-postgres>=0.29.14,<0.30",
    "dagster-webserver>=1.13.14",
    "duckdb>=1.5.4",
    "fastapi>=0.136,<1",
    "ja-media-core",
    "jinja2>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.2.2",
    "uvicorn>=0.41,<1",
]

[project.scripts]
ja-data = "ja_media_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ja_media_data"]

[tool.hatch.build.targets.wheel.force-include]
schema = "ja_media_data/lakehouse/schema"
postgres_schema = "ja_media_data/postgres_schema"
campaigns = "ja_media_data/campaigns"

[tool.uv.sources]
ja-media-core = { workspace = true }

[dependency-groups]
dev = [
    "httpx2>=2.4,<3",
]
