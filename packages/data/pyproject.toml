[project]
name = "ja-media-data"
version = "0.1.0"
description = "DuckLake data compiler and operator surface for ja-media"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.46",
    "duckdb>=1.5.4",
    "ja-media-core",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
ja-data = "ja_media_data.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ja_media_data"]

[tool.hatch.build.targets.wheel.force-include]
schema = "ja_media_data/lakehouse/schema"
postgres_schema = "ja_media_data/postgres_schema"

[tool.uv.sources]
ja-media-core = { workspace = true }
