[project]
name = "ja-media-data"
version = "0.1.0"
description = "DuckLake data compiler and operator surface for ja-media"
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.46",
    "celery>=5.6,<6",
    "dagster>=1.13.14",
    "dagster-celery>=0.29.14,<0.30",
    "dagster-postgres>=0.29.14,<0.30",
    "dagster-webserver>=1.13.14",
    "duckdb>=1.5.4",
    "fastapi>=0.136,<1",
    "ja-media-core",
    "jinja2>=3.1,<4",
    "kombu>=5.6,<6",
    "openai==2.45.0",
    "openai-agents==0.19.1",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2,<2",
    "uvicorn>=0.41,<1",
]

[project.scripts]
ja-data = "ja_media_data.cli:main"
ja-data-schema-init = "ja_media_data.schema_init:main"
ja-data-preflight = "ja_media_data.preflight:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ja_media_data"]

[tool.hatch.build.targets.wheel.force-include]
"migrations/ducklake" = "ja_media_data/migrations/ducklake"
"migrations/control_postgres" = "ja_media_data/migrations/control_postgres"

[tool.uv.sources]
ja-media-core = { workspace = true }
openai-agents = { git = "https://github.com/openai/openai-agents-python", rev = "c3f1781d56e8f1249a01674f18ba1f3e44a16dce" }

[dependency-groups]
dev = [
    "httpx2>=2.4,<3",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.3,<2",
]
